<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>SpineCodex — Agent Morphogenesis</title>
    <meta
      name="description"
      content="The SpineCodex agent morphogenesis launch film."
    />
    <style>
      :root {
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: #13251f;
        background: #f6f7f3;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: clamp(16px, 3vw, 40px);
      }

      main {
        width: min(1280px, 100%);
      }

      .player {
        overflow: hidden;
        border: 1px solid rgba(16, 68, 51, 0.14);
        border-radius: 18px;
        background: #fff;
        box-shadow: 0 24px 80px rgba(12, 52, 39, 0.12);
      }

      video {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #f6f7f3;
      }

      .meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 16px 20px 18px;
      }

      h1 {
        margin: 0;
        font-size: clamp(18px, 2vw, 24px);
        letter-spacing: -0.02em;
      }

      a {
        color: #08775c;
        font-weight: 650;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      @media (max-width: 640px) {
        .meta {
          align-items: flex-start;
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="player" aria-label="SpineCodex launch film">
        <video
          id="film"
          controls
          autoplay
          playsinline
          preload="metadata"
          poster="./spinecodex-film-poster.jpg"
        >
          <source src="./spinecodex-film-aria.mp4" type="video/mp4" />
          Your browser does not support HTML video.
        </video>
        <div class="meta">
          <h1>SpineCodex — Agent Morphogenesis</h1>
          <a href="https://github.com/GhabiX/SpineCodex">View on GitHub</a>
        </div>
      </section>
    </main>
    <script>
      const film = document.querySelector("#film");

      film.play().catch(() => {
        film.muted = true;
        film.play().catch(() => undefined);
      });
    </script>
  </body>
</html>
