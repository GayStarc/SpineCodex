schema_version = 1

[limits]
trim_threshold_bytes = 10000

[prompt]
jit = '''<spine_view>
All work must be Spine-managed. The Spine tree enables cost-efficient scaling
by recursively decomposing tasks into scoped nodes and merging finalized work
through compact continuation memory: routine bounded tasks remain lightweight,
while difficult or open-ended tasks can autonomously scale test-time compute
toward the best attainable outcome. Just-in-time context compilation keeps this
scaling efficient by turning each node's local working context into continuation
memory.

Proactively plan and decompose tasks into nodes as needed, while strictly
preserving correct parent-child relationships. Complete each node's work
efficiently within its scope.
Treat the Spine tree as the task's semantic scope hierarchy: each piece of work
belongs in the node that owns it. `open` enters a direct child, `next` moves to
a sibling under the same parent, and `close` returns to the immediate parent.
Use `$spine-plan-seed` when long-running work benefits from a durable plan.

Core workflow:

1. Begin a new top-level task with
   `open(<concrete, appropriately scoped task goal>)` while the current root
   epoch is active.
2. If the current node contains multiple pieces of work with clear scope and
   ownership boundaries, or if any part requires deeper exploration, use
   `open(<concrete, appropriately scoped direct-child goal>)` to enter one such
   piece. Apply this recursively as needed until the active work belongs in a
   focused, specific, and verifiable leaf node.
3. Use `next(<concrete sibling goal>, memory)` when the next work is a true
   sibling under the same parent.
4. Use `close(memory)` when the current node has produced enough state for
   correct continuation and the next work belongs to its immediate parent. To
   return to a higher ancestor, close one level at a time and reassess after
   each transition.

Conventions:

* Minimize total context pressure, roughly model iterations times average
  visible context, by recursively decomposing work at semantic boundaries,
  batching independent work, and completing each focused node in as few
  iterations as practical. When a distinct subproblem deserves its own node,
  open that node as soon as the boundary is known, before accumulating its
  detailed exploration and implementation history in the parent. `open`
  focuses scope but does not reduce inherited context; ancestor work remains
  visible to every descendant, and the boundary's compression benefit is
  realized only after `close` or `next`. Plan boundaries and Node Memory so
  later nodes can continue from compact decisions, results, and remaining
  obligations instead of broadly reloading or reconstructing the same detailed
  context; revisit source details only when correctness requires it.
* Work on each subtask in the smallest sufficient context: open and close nodes
  at boundaries that keep the active context focused without causing repeated
  context reloads. Use the context pressure reported in `<spine_status>` to
  adjust these boundaries and reduce total task cost.
* Use at most one Spine transition per assistant turn. Ordinary task tools may
  accompany it and belong to the resulting node; the transition applies to the
  current node's prior ReAct history.
* After `close` or `next`, `memory` replaces the finalized node's local working
  content; follow the tool parameter description to preserve the state required
  for continuation. Runtime preserves user messages and child memories, so use
  Node Memory for the additional continuation state they do not already
  provide.
* Root epochs are synthetic containers and cannot be closed.
* `<spine_status>` provides current-node orientation. `<spine_memory>` provides
  continuation memory compiled from finalized work.
* Spine nodes define task-semantic boundaries rather than user-response
  boundaries, so answer the user as soon as useful and create nodes only for
  work that needs its own task scope.

</spine_view>
'''
trim = ""
spawn = ""
spawn_explicit_request_only = "Do not use the MultiAgent collaboration tools to spawn sub-agents unless the user or applicable AGENTS.md/skill instructions explicitly ask for sub-agents, delegation, or parallel agent work. This restriction applies only to the MultiAgent collaboration surface and does not restrict independently available tools such as spine.spawn."
spawn_proactive = "Proactive MultiAgent collaboration is active. Any earlier instruction requiring an explicit user request before using the MultiAgent collaboration tools no longer applies. Use those collaboration tools when parallel work would materially improve speed or quality. This policy does not govern independent tools such as spine.spawn. This mode remains active until a later multi-agent mode developer message changes it."

[tools.open]
description = "Open a concrete child node for one appropriately scoped goal under the current Spine cursor. Ordinary task tools issued alongside it belong to the child; the transition applies to the current node's prior ReAct history."

[tools.close]
description = "Finalize the current Spine node with the supplied continuation memory and resume its immediate parent. Ordinary task tools issued alongside it belong to the parent; the transition applies to the current node's prior ReAct history. Root-epoch nodes cannot be closed."

[tools.next]
description = "Finalize the current Spine node with the supplied continuation memory and continue in a fresh sibling under the same parent. Ordinary task tools issued alongside it belong to the sibling; the transition applies to the current node's prior ReAct history."

[tools.trim]
description = "Conservatively clean up one tagged tool-response projection; this never changes the Spine tree or creates memory. A TRIM_ID is live only for the immediately previous tool-result batch, and only in your next assistant tool request. After any later tool request it expires; if trim misses, treat the id as expired and continue. Use slice for needed visible evidence, snip only when useful facts are preserved elsewhere, and leave untrimmed if the original may still be needed."

[tools.spawn]
description = "Run a fission transaction over two or more self-contained tasks. Each task inherits the current context through native full-history child creation, runs concurrently in an independent session, needs no parent follow-up, and returns one terminal final memory. The parent waits for every child, then imports all closed child nodes atomically in input order. Use this proactively when the current node has two or more independent, self-contained workstreams and concurrent execution would materially improve speed or result quality. Child workspace and external effects are not transactional; only dispatch tasks whose writes are non-conflicting or explicitly coordinated."
