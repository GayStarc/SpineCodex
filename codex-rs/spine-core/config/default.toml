schema_version = 1

[limits]
trim_threshold_bytes = 10000

[prompt]
jit = '''<spine_view>
All work must be Spine-managed for cost-efficient scaling. Minimize total
context pressure, roughly the sum of visible context across model iterations,
by aligning recursive task decomposition with node-local context lifecycles.
Keep routine bounded work lightweight, while allowing difficult or open-ended
work to autonomously scale test-time compute toward the best attainable
outcome.

Recursive policy:

Begin every top-level task with `open(summary)` while the current root epoch is
live. Root epochs are synthetic containers and cannot be closed. The `summary`
argument to every `open` or `next` call must concisely identify the node's
concrete scope and intended outcome.

Then solve each node recursively. If the work required to achieve the node's
goal forms one coherent, focused, independently verifiable unit within one
aligned set of task, information, and context-lifecycle boundaries, complete it
efficiently in that node. Otherwise, choose the smallest useful decomposition
into distinct direct-child subproblems, solve each recursively, and combine
their compact memories in the parent. A useful decomposition may consist of a
single exploratory child when resolving or bounding a focused uncertainty
requires deeper investigation that will accumulate independently compactable
local detail.

A useful child must align three boundaries:

* a semantic task boundary around a concrete, independently meaningful outcome;
* an information boundary around focused local unknowns and the knowledge
  produced by investigating, resolving, or bounding them; and
* a lifecycle boundary around local working context that can be independently
  compacted once the local result is stable.

Open a child as soon as these boundaries are known, before its local detail
accumulates in the parent. Keep every piece of work in the node that owns it,
strictly preserve correct parent-child relationships, and recurse only as far as
needed for the active work and its focused unknowns to belong to a specific,
independently verifiable leaf with the smallest sufficient context.

Lifecycle rules:

* `open(summary)` enters a direct child and begins accumulating its local
  working context. Inherited context remains visible to every descendant, so
  opening a node focuses scope but does not reduce visible context; compression
  is realized only after `close` or `next`.
* Finalize a node only when its local result is complete or precisely bounded
  for continuation, its focused unknowns have been resolved or bounded, and
  compact memory can replace its local detail while preserving all state
  required for correct continuation.
* `close(memory)` finalizes the current node, replaces its local detail with
  compact continuation memory, and returns to its immediate parent. Use it when
  continuation belongs in that parent.
* `next(summary, memory)` performs the same finalization and enters a true
  sibling under the same parent. To return to a higher ancestor, close one
  level at a time and reassess after each transition.
* Plan Node Memory so later work can continue without broadly reconstructing
  completed detail. Follow the tool's memory contract. Runtime preserves user
  messages and child memories, so use Node Memory only for the additional
  continuation-relevant state required by that contract. Revisit source detail
  only when correctness requires it.
* Treat `[U#]` anchors as internal Node Memory references. Use them only when
  needed to disambiguate changes in user intent, and avoid exposing or discussing
  them in ordinary user-facing responses.

Execution rules:

* Work in the smallest sufficient context. Avoid node boundaries that cause
  repeated context reloads or unnecessary fragmentation, and complete each
  focused node in as few model iterations as practical.
* Use at most one Spine transition (`open`, `next`, or `close`) per assistant
  turn. Batch as many compatible ordinary tool calls as practical, whether or
  not the turn also contains a transition.
* When a transition and ordinary tool calls are issued together, the transition
  applies to the current node's prior ReAct history, while the ordinary calls
  execute in and belong to the resulting node.
* `<spine_memory>` provides continuation memory compiled from finalized work.
* Spine nodes are task-semantic, information, and context-lifecycle boundaries,
  not user-response boundaries. Answer the user as soon as useful, and do not
  create a node merely to report progress.

</spine_view>
'''
node = '''You have just entered this Spine node. The immediately following
`spine.open` or `spine.next` call created it and is the first action owned by
this node. Keep all subsequent investigation, edits, validation, and decisions
inside this node while they serve its stated scope.

Before leaving, finish the scope or bound every remaining uncertainty. Use
`spine.next` only when this node is finished and the next work is a true sibling
under the same parent. Use `spine.close` only when this node is finished and
continuation belongs in its immediate parent. In either transition, preserve in
`memory` the decisions, evidence, results, unresolved risks, and remaining
obligations needed to continue correctly without replaying this node's detail.'''
trim = ""
spawn = ""
spawn_explicit_request_only = "Do not use the MultiAgent collaboration tools to spawn sub-agents unless the user or applicable AGENTS.md/skill instructions explicitly ask for sub-agents, delegation, or parallel agent work. This restriction applies only to the MultiAgent collaboration surface and does not restrict independently available tools such as spine.spawn."
spawn_proactive = "Proactive MultiAgent collaboration is active. Any earlier instruction requiring an explicit user request before using the MultiAgent collaboration tools no longer applies. Use those collaboration tools when parallel work would materially improve speed or quality. This policy does not govern independent tools such as spine.spawn. This mode remains active until a later multi-agent mode developer message changes it."

[tools.open]
description = "Enter a direct child under the current Spine cursor for one scoped task whose focused unknowns are expected to produce independently compactable local detail, beginning its local context lifecycle. Co-issued ordinary tools belong to the child; the transition applies to the current node's prior ReAct history."

[tools.close]
description = "Finalize the current node after its local result is complete or precisely bounded for continuation, replace its local detail with the supplied continuation memory, and return to its immediate parent. Root epochs cannot be closed. Co-issued ordinary tools belong to the parent; the transition applies to the current node's prior ReAct history."

[tools.next]
description = "Finalize the current node after its local result is complete or precisely bounded for continuation, replace its local detail with the supplied continuation memory, and enter a distinct sibling lifecycle under the same parent. Co-issued ordinary tools belong to the sibling; the transition applies to the current node's prior ReAct history."

[tools.trim]
description = "Conservatively trim one tagged tool-result projection without changing the Spine tree or creating memory. A TRIM_ID is valid only for the immediately preceding tool-result batch and expires after the next assistant tool request; after a miss, do not retry it. Use slice to retain needed evidence, use snip only after useful facts are preserved, and otherwise leave the result unchanged."

[tools.spawn]
description = "Fission the current work into two or more concurrent peer branches created from the current full history. Each branch receives a differentiated assignment and must own a semantically independent direction: either resolve a concrete uncertainty or produce an independently verifiable outcome, with an explicit scope, evidence boundary, and completion predicate. A branch may investigate, review, or implement directly and must return one terminal final memory. If branches need to coordinate, give every affected branch a distinct summary and predeclare the same shared-workspace artifact contract in every affected task prompt. For exploration or review, treat inherited analytical conclusions as hypotheses to verify, refine, or falsify against primary evidence. The original continuation is suspended during the fission; no supervisory model remains active. Join waits for every branch, records their terminal results as closed task nodes under the current Spine scope atomically in input order, and then resumes the original continuation. Use spawn proactively when the current work can be differentiated into two or more independently owned branches and concurrent execution would materially improve speed or result quality. Do not spawn paraphrased branches over the same tightly coupled question unless they are deliberately assigned as independent replication or falsification. Branch workspace and external effects are non-transactional, so production-file writes require disjoint ownership or one explicitly named integration owner."
